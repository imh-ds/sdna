name: Reduced validation matrix

on:
  workflow_dispatch:

concurrency:
  group: validation-matrix-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Fixed-seed reduced validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Prepare artifact directory
        env:
          VALIDATION_DIR: ${{ runner.temp }}/sdna-validation-matrix
        run: |
          mkdir -p "$VALIDATION_DIR"
          cp simulations/configs/validation_matrix.json "$VALIDATION_DIR/validation_matrix.json"
          {
            echo "workflow=$GITHUB_WORKFLOW"
            echo "run_id=$GITHUB_RUN_ID"
            echo "event=$GITHUB_EVENT_NAME"
            echo "sha=$GITHUB_SHA"
          } > "$VALIDATION_DIR/github-run.txt"

      - name: Run fixed-seed validation matrix
        env:
          VALIDATION_DIR: ${{ runner.temp }}/sdna-validation-matrix
        run: |
          python -m simulations.run_simulation \
            simulations/configs/validation_matrix.json \
            "$VALIDATION_DIR/results.csv" \
            --smoke

      - name: Create machine-readable and Markdown summaries
        env:
          VALIDATION_DIR: ${{ runner.temp }}/sdna-validation-matrix
        run: >-
          python -c "from simulations.summarize import summarize_results; summarize_results('$VALIDATION_DIR/results.csv', '$VALIDATION_DIR/summary.json', '$VALIDATION_DIR/summary.md')"

      - name: Validate matrix schema and invariants
        env:
          VALIDATION_DIR: ${{ runner.temp }}/sdna-validation-matrix
        run: >-
          python -m tools.validate_smoke
          "$VALIDATION_DIR/results.csv"
          "$VALIDATION_DIR/results.metadata.json"
          "$VALIDATION_DIR/summary.json"
          simulations/configs/validation_matrix.json

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdna-validation-matrix-${{ github.run_id }}
          path: ${{ runner.temp }}/sdna-validation-matrix
          if-no-files-found: error
          retention-days: 30
