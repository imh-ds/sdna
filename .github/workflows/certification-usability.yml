name: SDNA certification-usability audit

on:
  workflow_dispatch:

concurrency:
  group: certification-usability-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    name: Phase A audit and instrumented Phase B rerun
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUDIT_DIR: ${{ runner.temp }}/sdna-certification-usability
      REFERENCE_DIR: ${{ runner.temp }}/sdna-certification-usability/reference

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]" -c constraints-ci.txt

      - name: Prepare audit directory and provenance
        run: |
          mkdir -p "$AUDIT_DIR" "$REFERENCE_DIR"
          cp simulations/configs/cap_expansion_v1.json "$AUDIT_DIR/cap_expansion_v1.json"
          cp simulations/configs/certification_usability_v1.json "$AUDIT_DIR/certification_usability_v1.json"
          {
            echo "workflow=$GITHUB_WORKFLOW"
            echo "run_id=$GITHUB_RUN_ID"
            echo "event=$GITHUB_EVENT_NAME"
            echo "ref=$GITHUB_REF"
            echo "sha=$GITHUB_SHA"
          } > "$AUDIT_DIR/github-run.txt"
          {
            echo "gh run download 34871220664 --repo $GITHUB_REPOSITORY --name sdna-cap-expansion-34871220664 --dir $REFERENCE_DIR"
            echo "python -m tools.audit_certification_usability reference/results.csv reference/results.metadata.json reference/summary.json simulations/configs/cap_expansion_v1.json simulations/configs/certification_usability_v1.json $AUDIT_DIR/phase-a-audit.json $AUDIT_DIR/phase-a-audit.md"
            echo "python -m tools.run_certification_usability simulations/configs/cap_expansion_v1.json $AUDIT_DIR/results.csv"
            echo "python -m tools.summarize_certification_usability $AUDIT_DIR/results.csv $AUDIT_DIR/results.metadata.json $AUDIT_DIR/summary.json reference/results.csv reference/results.metadata.json reference/summary.json simulations/configs/cap_expansion_v1.json simulations/configs/certification_usability_v1.json --validate"
          } > "$AUDIT_DIR/commands.txt"

      - name: Download accepted Task 24 reference artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download 34871220664
          --repo "$GITHUB_REPOSITORY"
          --name sdna-cap-expansion-34871220664
          --dir "$REFERENCE_DIR"

      - name: Run Phase A read-only artifact audit
        run: >-
          python -m tools.audit_certification_usability
          "$REFERENCE_DIR/results.csv"
          "$REFERENCE_DIR/results.metadata.json"
          "$REFERENCE_DIR/summary.json"
          simulations/configs/cap_expansion_v1.json
          simulations/configs/certification_usability_v1.json
          "$AUDIT_DIR/phase-a-audit.json"
          "$AUDIT_DIR/phase-a-audit.md"

      - name: Run instrumented Phase B workflow
        run: >-
          python -m tools.run_certification_usability
          simulations/configs/cap_expansion_v1.json
          "$AUDIT_DIR/results.csv"

      - name: Summarize and validate Phase B evidence
        run: >-
          python -m tools.summarize_certification_usability
          "$AUDIT_DIR/results.csv"
          "$AUDIT_DIR/results.metadata.json"
          "$AUDIT_DIR/summary.json"
          "$REFERENCE_DIR/results.csv"
          "$REFERENCE_DIR/results.metadata.json"
          "$REFERENCE_DIR/summary.json"
          simulations/configs/cap_expansion_v1.json
          simulations/configs/certification_usability_v1.json
          --validate

      - name: Upload certification-usability artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sdna-certification-usability-${{ github.run_id }}
          path: ${{ runner.temp }}/sdna-certification-usability
          if-no-files-found: error
          retention-days: 90
