name: Simulation smoke test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Fixed-seed simulation smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run fixed-seed simulation
        env:
          SMOKE_DIR: ${{ runner.temp }}/sdna-smoke
        run: |
          mkdir -p "$SMOKE_DIR"
          python -m simulations.run_simulation \
            simulations/configs/smoke.json \
            "$SMOKE_DIR/results.csv" \
            --smoke

      - name: Create machine-readable summary
        env:
          SMOKE_DIR: ${{ runner.temp }}/sdna-smoke
        run: |
          python -c "from simulations.summarize import summarize_results; summarize_results('$SMOKE_DIR/results.csv', '$SMOKE_DIR/summary.json', '$SMOKE_DIR/summary.md')"

      - name: Validate smoke schema and invariants
        env:
          SMOKE_DIR: ${{ runner.temp }}/sdna-smoke
        run: >-
          python -m tools.validate_smoke
          "$SMOKE_DIR/results.csv"
          "$SMOKE_DIR/results.metadata.json"
          "$SMOKE_DIR/summary.json"
          simulations/configs/smoke.json

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/sdna-smoke
          if-no-files-found: error
