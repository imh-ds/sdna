name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]" -c constraints-ci.txt

      - name: Lint
        run: ruff check src tests simulations benchmarks tools

      # The distributable library is the current strict mypy contract.
      # Simulation, benchmark, and validation harness typing is documented in
      # docs/development/ci_scope.md and remains covered by Ruff and tests.
      - name: Type check
        run: mypy --python-version "${{ matrix.python-version }}" src/sdna

      - name: Test with coverage
        run: python -m pytest --cov=sdna --cov-report=term-missing
